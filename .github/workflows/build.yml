# Builds the installer and portable zip on every push and pull request.
# Pushing a tag like v0.2.0 also publishes them as a GitHub release, which installed copies
# of the app pick up as "Update available".
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $found = @("${env:ProgramFiles(x86)}", $env:ProgramFiles) | ForEach-Object { Get-ChildItem $_ -Directory -Filter "Inno Setup *" -ErrorAction SilentlyContinue } |
            Where-Object { Test-Path (Join-Path $_.FullName "ISCC.exe") }
          if (-not $found) { choco install innosetup --no-progress -y }

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $v = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $base = ([xml](Get-Content src/WebSkinPlayer/WebSkinPlayer.csproj -Raw)).Project.PropertyGroup |
              ForEach-Object { $_.Version } | Where-Object { $_ } | Select-Object -First 1
            $v = "$base-ci.$env:GITHUB_RUN_NUMBER"
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build installer and portable zip
        shell: pwsh
        run: ./tools/Build-Release.ps1 -Version '${{ steps.version.outputs.version }}' -RepositoryUrl '${{ github.server_url }}/${{ github.repository }}'

      - uses: actions/upload-artifact@v5
        with:
          name: WebSkinPlayer-${{ steps.version.outputs.version }}
          path: |
            artifacts/*.exe
            artifacts/*.zip

      - name: Publish the release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $files = Get-ChildItem artifacts/* -File -Include *.exe, *.zip | ForEach-Object FullName
          $flags = @('--generate-notes', '--title', "WebSkin Player $v")
          if ($v.Contains('-')) { $flags += '--prerelease' }
          gh release create '${{ github.ref_name }}' @files @flags
