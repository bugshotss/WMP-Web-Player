[package]
name = "nowplaying-host"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.23.1"
block2 = "0.6.2"
libc = "0.2.191"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", features = ["NSDictionary", "NSString", "NSData", "NSDate", "NSValue", "NSArray", "NSEnumerator"] }
serde_json = "1.0.154"
